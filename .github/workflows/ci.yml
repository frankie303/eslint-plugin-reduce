name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, eslint ${{ matrix.eslint }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is the floor declared in `engines` (ESLint 10's own minimum);
        # 22 and 24 are the current LTS lines.
        node: [20, 22, 24]
        eslint: [9, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use ESLint ${{ matrix.eslint }}
        run: npm install --no-save --no-package-lock eslint@${{ matrix.eslint }}
      - run: npx eslint --version
      - run: npm test

  examples:
    name: example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [eslint, oxlint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json
      - run: npm ci
        working-directory: examples/${{ matrix.example }}
      - run: npm run lint
        working-directory: examples/${{ matrix.example }}
